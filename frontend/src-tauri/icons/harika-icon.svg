<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- HARIKA app icon: the iridescent orb on a deep, Apple-style rounded tile.
       Regenerate all sizes with: npx tauri icon src-tauri/icons/harika-icon.svg -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1a4a"/>
      <stop offset="1" stop-color="#07061a"/>
    </linearGradient>
    <radialGradient id="base" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#2a1f6e"/>
      <stop offset="1" stop-color="#0b0924"/>
    </radialGradient>
    <radialGradient id="blue" cx="0.33" cy="0.36" r="0.5">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purple" cx="0.7" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#BF5AF2"/>
      <stop offset="1" stop-color="#BF5AF2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pink" cx="0.45" cy="0.74" r="0.45">
      <stop offset="0" stop-color="#FF375F"/>
      <stop offset="1" stop-color="#FF375F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orange" cx="0.68" cy="0.7" r="0.36">
      <stop offset="0" stop-color="#FF9F0A"/>
      <stop offset="1" stop-color="#FF9F0A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shine" cx="0.5" cy="0.15" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#BF5AF2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#BF5AF2" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sphere"><circle cx="512" cy="512" r="250"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <!-- Apple-style tile: 824 x 824 with continuous-looking corners, centred on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <circle cx="512" cy="512" r="330" fill="url(#halo)"/>

  <g clip-path="url(#sphere)">
    <circle cx="512" cy="512" r="250" fill="url(#base)"/>
    <g filter="url(#soft)" style="mix-blend-mode:screen">
      <rect x="262" y="262" width="500" height="500" fill="url(#blue)"/>
      <rect x="262" y="262" width="500" height="500" fill="url(#purple)"/>
      <rect x="262" y="262" width="500" height="500" fill="url(#pink)"/>
      <rect x="262" y="262" width="500" height="500" fill="url(#orange)"/>
    </g>
    <ellipse cx="512" cy="372" rx="150" ry="92" fill="url(#shine)"/>
  </g>
  <circle cx="512" cy="512" r="249.5" fill="none" stroke="#ffffff" stroke-opacity="0.28"/>
</svg>
